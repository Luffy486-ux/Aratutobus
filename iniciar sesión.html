<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center;
               background: url('images/fondo-sin-texto.jpg') center/cover no-repeat; }
        .login-contenedor { background: white; padding: 30px; border-radius: 8px; width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        h2 { margin-bottom: 20px; }
        form { display: flex; flex-direction: column; text-align: left; }
        label { margin-bottom: 5px; font-weight: bold; }
        input { padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="submit"] { background: #007bff; color: white; border: none; cursor: pointer; }
        p { margin-top: 15px; font-size: 14px; }
        a { color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-contenedor">
        <h2>Iniciar Sesión</h2>
        <form action="index.html" method="POST">
            <label>Nombre de Usuario:</label> <input type="text" required>
            <label>Contraseña:</label> <input type="password" required>
            <input type="submit" value="Ingresar">
        </form>
        <p>¿No tienes cuenta? <a href="Registro.html">Regístrate aquí</a></p>
    </div>
</body>
</html>
